<!DOCTYPE html> <!-- HTML 5 döküman tipi bildirimi. -->
<html lang="tr"> <!-- Sayfa dilini Türkçe yapar. -->
<head>
    <meta charset="UTF-8"> <!-- Türkçe karakterleri düzgün gösteriyor -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobil uyumluluğu sağlar ve sayfanın genişliğini cihaz ekranına göre otomatik bir şekilde yapar. -->
    <title>Dark Side Login</title> <!-- Sayfanın başlığı -->
    <link rel="stylesheet" href="style.css"> <!-- "style.css" dosyasını HTML'e bağlar. Tasarım ve stiller buradan yüklenir. -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet"> <!-- Google Fonts'u yüklüyor. -->
</head>
<body>

<!-- Sayfada canlı saati göstermek için kullanılıyor. Saat JavaScript (script.js) tarafından güncelleniyor. -->
<div id="clock"></div>

    <!-- Background -->
    <video autoplay loop muted id="background-video"> <!-- 1. "autoplay": sayfa açılınca video otomatik başlar. - 2. "loop": Videoyu döngüye alır. - 3. "muted": Ses kapatır. -->
        <source src="kylo ren.mp4" type="video/mp4"> <!-- Dosya adı ve dosya tipi. -->
    </video>

    <!-- Sith Holocron (Dörtgen şekli) (Giriş Butonu) -->
    <div class="holocron-container">
        <label for="toggle-login" class="sith-holocron"></label>
    </div>

    <!-- Kullanıcı Holocron'a tıkladığında checkbox aktif hale geleceği için login formu açılacak. -->
    <input type="checkbox" id="toggle-login" hidden>

    <!-- Login Formu -->
    <div class="login-container">
        <div class="login-box">
            <h2 class="join-text">Joın the Dark Sıde</h2> <!-- Login Formun başlığı. -->
            <input type="text" placeholder="Sith ID" class="input-field" pattern="DARTHVADER"> <!-- Sith ID giriliyor. -->
            <input type="password" placeholder="Authentication Code" class="input-field" pattern="ORDER66"> <!-- Şifre giriliyor. -->
            <button class="login-submit" onclick="saveLogin()">Proceed</button> <!-- Giriş butonu.-->
        </div>
    </div>

    <script src="script.js"></script> <!-- script scope, dar tutulması gerekiyor -->
</body>
</html>
