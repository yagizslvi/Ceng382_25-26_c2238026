<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"> <!-- Türkçe karakterleri düzgün gösteriyor -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobil uyumluluk -->
    <title>Dark Side Login</title> <!-- Sayfanın başlığı -->
    <link rel="stylesheet" href="style.css"> <!--  href ile css dosyasını bağlanıyor -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet"> <!-- Login formda kullandığım yazı tipi -->
</head>
<body>

<!-- burada canlı saati ekrana ekliyorum. -->
<div id="clock"></div>

    <!-- Backgrounddaki Kylo Ren -->
    <video autoplay loop muted id="background-video">
        <source src="kylo ren.mp4" type="video/mp4">
    </video>

    <!-- Sith Holocron (Dörtgen şekli) (Giriş Butonu) -->
    <div class="holocron-container">
        <label for="toggle-login" class="sith-holocron"></label>
    </div>

    <!-- Kullanıcı Holocron'a tıkladığında checkbox aktif hale geleceği için login formu açılacak -->
    <input type="checkbox" id="toggle-login" hidden>

    <!-- Login Formu -->
    <div class="login-container">
        <div class="login-box">
            <h2 class="join-text">Joın the Dark Sıde</h2>
            <input type="text" placeholder="Sith ID" class="input-field" pattern="DARTHVADER"> <!-- Sith ID giriliyor. -->
            <input type="password" placeholder="Authentication Code" class="input-field" pattern="ORDER66"> <!-- Şifre giriliyor. -->
            <button class="login-submit" onclick="saveLogin()">Proceed</button> <!-- Giriş butonu.-->
            <p class="error-message">Invalid credentials. Access denied.</p> <!-- !!!! Yanlış giriş yapıldığında uyarı vermesi için yazdım ama nedense işe yaramıyor çözümünü bulamadım ! -->
        </div>
    </div>

    <script src="script.js"></script> <!-- script scope, dar tutulması gerekiyor -->
</body>
</html>
