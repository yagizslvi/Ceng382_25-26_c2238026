<!DOCTYPE html> <!-- HTML 5 döküman tipi bildirimi. -->
<html lang="en"> <!-- Sayfanın dilini türkçe olarak belirler. -->
<head>
  <meta charset="UTF-8"> <!-- Türkçe karakterlerin düzgün görünmesini sağlar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobil uyumluluğu sağlar ve sayfanın genişliğini cihaz ekranına göre otomatik ayarlar. -->
  <title>Class Information</title> <!-- Sayfa başlığını belirler. -->
  <link rel="stylesheet" href="style_table.css"> <!-- style.css dosyasını HTML'e bağlar. Tasarım ve stiller buradan yüklenir. -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet"> <!-- Yazı tipini kullanmak için Google Fonts'u yüklüyor. -->
</head>
<body>

<!-- Arka Plan Videosu -->
<div id="video-container">
  <video autoplay muted loop id="background-video"> <!-- autoplay: sayfa açıldığında video otomatik başlar. -- loop: videyu döngüye alır. -- muted: ses kapatır. -->
    <source src="darth-vader.mp4" type="video/mp4"> <!-- src: MP4 Dosyasının adı. -- type: dosya türü. -->
  </video>
</div>

<!-- Ana İçerik Bölgesi -->
<div id="content-container">

  <!-- Form Alanı -->
  <div id="form-container">
    <h2>Class Information Form</h2>
    <form id="class-form">
      <label> Class Name: <input type="text" id="class-name"> </label>
      <label> Number of People: <input type="number" id="class-size"> </label>
      <label> Description: <input type="text" id="class-desc"> </label>
      <button type="submit"> Add Class </button>
    </form>
  </div>

  <!-- Tablo Alanı -->
  <div id="table-container">
    <h2> Class List </h2>
    <table id="class-table">
      <thead>
      <tr>
        <th>Class Name</th>
        <th>Number of People</th>
        <th>Description</th>
      </tr>
      </thead>
      <tbody>
      <!-- Yeni eklenen veriler buraya gelecek -->
      </tbody>
    </table>
  </div>

</div>

<script src="table.js"></script>
</body>
</html>
